[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pysalesforceutils"
version = "1.1.1"
description = "Python module to wrap the Salesforce APIs"
readme = "README.md"
authors = [{name = "Glen Barger", email = "gbarger@gmail.com"}]
dependencies = [
    "requests",
]

[project.optional-dependencies]
soap = ["zeep"]
jwt = ["PyJWT[crypto]>=2"]

[project.urls]
Homepage = "https://github.com/gbarger/PySalesforce"

[tool.setuptools]
packages = ["pysalesforceutils"]

[tool.setuptools.package-data]
pysalesforceutils = ["WSDL/*.wsdl"]
